name: lean
on:
  push:
    paths: ["research/lean-millennium/**"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/lean-millennium
          build: true
          use-github-cache: true
      - name: no sorry in the Lean files that back a claim
        run: |
          if grep -rn --include=*.lean -w sorry research/lean-millennium/MillenniumLean research/lean-millennium/MillenniumLean.lean; then
            echo "::error::sorry found"; exit 1
          fi
