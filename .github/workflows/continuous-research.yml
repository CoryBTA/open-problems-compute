name: continuous-research
# The loop that keeps Actions working, and heals it. Every 6 hours:
#   1. scripts/ci_heal.py cancels stuck runs, re-runs a failed run once, blocks a workflow after 3 failures in a row
#      (one deduplicated issue; the block lifts after one success) and closes its issues once healthy;
#   2. the next unfinished Millennium job of compute_queue.json is started if none is running;
#   3. the next item of research/schur-structured/sweep_queue.json is started if no sweep is running;
#   4. an empty Schur queue opens one issue.
# Grove's daily task (grove-ci-results-pull.py) is the watchdog from outside: it re-enables this workflow if GitHub
# paused it (60 days without activity) and starts it if it has not run for 14 hours.
on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: continuous-research
  cancel-in-progress: false
jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: self-heal (cancel stuck, re-run once, block after repeated failures)
        id: heal
        run: python3 scripts/ci_heal.py --repo "$REPO"
      - name: start the next Millennium job
        if: steps.heal.outputs.block_millennium_compute != '1'
        run: |
          git fetch -q origin results 2>/dev/null || true
          mjob=$(python3 scripts/ci_next_job.py)
          running=$(gh run list -R "$REPO" --workflow millennium-compute.yml --json status --jq '[.[] | select(.status!="completed")] | length')
          if [ -n "$mjob" ] && [ "$running" = "0" ]; then
            echo "dispatching millennium job $mjob"
            gh workflow run millennium-compute.yml -R "$REPO" -f job="$mjob" -f attempt=1
          else
            echo "millennium: job='$mjob' running=$running: nothing to start"
          fi
      - name: start the next Schur sweep
        if: steps.heal.outputs.block_schur_sweep != '1'
        run: |
          running=$(gh run list -R "$REPO" --workflow schur-sweep.yml --json status --jq '[.[] | select(.status!="completed")] | length')
          if [ "$running" != "0" ]; then echo "a sweep is running: nothing to start"; exit 0; fi
          git fetch -q origin results 2>/dev/null || true
          done_files=$(git ls-tree -r --name-only origin/results schur/ 2>/dev/null || true)
          next=""
          for it in $(jq -c '.items[]' research/schur-structured/sweep_queue.json); do
            n=$(echo "$it" | jq -r .n)
            p=$(echo "$it" | jq -r .prefix)
            if ! echo "$done_files" | grep -qx "schur/n${n}-p${p}.json"; then next="$it"; break; fi
          done
          if [ -z "$next" ]; then
            title="sweep queue is empty"
            open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -z "$open" ]; then
              gh issue create -R "$REPO" --title "$title" --body "Every item of research/schur-structured/sweep_queue.json has a result on branch results. Add items to keep the loop running."
            fi
            exit 0
          fi
          n=$(echo "$next" | jq -r .n)
          p=$(echo "$next" | jq -r .prefix)
          echo "dispatching n=$n prefix=$p"
          gh workflow run schur-sweep.yml -R "$REPO" -f n="$n" -f prefix="$p"
