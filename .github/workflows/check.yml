name: check
# Catches a broken workflow or script before the 6-hourly driver runs it: actionlint on every workflow, and the unit tests
# for the Schur code, the shard merge and the self-healing policy. Also runs weekly so a changed runner image or
# dependency shows up here first.
on:
  push:
  pull_request:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: lint every workflow
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install python-sat pytest pytest-timeout pytest-xdist
      - run: python -m pytest tests/unit -n 2 --timeout=300 -p no:cacheprovider -q
