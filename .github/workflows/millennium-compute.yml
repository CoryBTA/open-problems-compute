name: millennium-compute
# Long numerical jobs outside the Claude routine. Each job stops itself inside its time budget and saves a checkpoint;
# a partial run (exit 75) re-dispatches this workflow (up to MAX_ATTEMPTS) so a 12 h job runs as three 5 h jobs.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "job to run"
        required: true
        default: ns_kida_n192
        type: choice
        options: [ns_kida_n128, ns_kida_n192, ns_tg5_n128, connes_flint, bsd_flint, sat_threshold]
      attempt:
        description: "attempt number (set by the workflow when it re-dispatches itself)"
        required: false
        default: "1"
concurrency:
  group: millennium-compute
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
env:
  MAX_ATTEMPTS: "4"
  JOB: ${{ github.event.inputs.job || 'ns_kida_n192' }}
  ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install numpy scipy mpmath python-flint python-sat
      - name: restore checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ckpt
          key: ckpt-${{ env.JOB }}-none
          restore-keys: ckpt-${{ env.JOB }}-
      - name: run job (stops itself after budget-min minus 10)
        id: run
        run: |
          mkdir -p ckpt
          set +e
          python scripts/ci_run_job.py "$JOB" --ckpt-dir ckpt --budget-min 330
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 75 ]
      - name: save checkpoint
        if: always() && steps.run.outputs.code == '75'
        uses: actions/cache/save@v4
        with:
          path: ckpt
          key: ckpt-${{ env.JOB }}-${{ github.run_id }}-${{ env.ATTEMPT }}
      - name: push results (appends to branch results, never main or cloud)
        if: steps.run.outputs.code == '0'
        run: |
          git config user.name "compute-bot"; git config user.email "compute-bot@users.noreply.github.com"
          { git diff --name-only HEAD -- research; git ls-files -o --exclude-standard -- research; } | grep '\.json$' | sort -u > /tmp/out.txt || true
          [ -s /tmp/out.txt ] || { echo "no result files"; exit 0; }
          tar cf /tmp/out.tar -T /tmp/out.txt
          git fetch origin results || true
          if git rev-parse -q --verify origin/results >/dev/null; then git checkout -f -B results origin/results; else git checkout -f -B results origin/main; fi
          tar xf /tmp/out.tar
          while IFS= read -r f; do git add -- "$f"; done < /tmp/out.txt
          git commit -m "compute results: $JOB run ${{ github.run_id }}" || exit 0
          git push origin results
      - name: continue in a new run
        if: steps.run.outputs.code == '75'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=$((ATTEMPT + 1))
          if [ "$next" -gt "$MAX_ATTEMPTS" ]; then echo "attempt limit reached; the checkpoint is cached, start it again by hand"; exit 0; fi
          gh workflow run millennium-compute.yml --ref "${{ github.ref_name }}" -f job="$JOB" -f attempt="$next"
